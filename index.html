<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART PATH NER · Logistics & Access</title>
<link rel="stylesheet" href="style.css?v=7"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
.mapbox iframe{width:100%;height:100%;border:0;display:block}.maptools{position:relative!important;top:auto!important;right:auto!important;z-index:auto!important;display:flex;gap:7px;align-items:center;justify-content:flex-end;padding:8px;background:#fff;border-bottom:1px solid var(--line)}.maptools select{max-width:185px;border:1px solid var(--line);background:white;border-radius:7px;padding:7px 8px;font-size:10px;color:var(--ink)}.maptools .district-select{max-width:180px}.maplink{position:absolute;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);padding:7px 9px;border-radius:7px;font-size:9px;color:var(--green);text-decoration:none;font-weight:700;z-index:2}.mapselectlabel{font-size:9px;color:var(--muted);padding:5px 8px}
/* Indian tricolour brand accents; the page structure and interactions remain unchanged. */
:root{--ink:#172c42;--muted:#6d7d88;--bg:#f6f7f5;--line:#e5e8e4;--green:#138808;--deep:#102d50;--lime:#ff9933;--red:#c65045;--amber:#c1842e}
.top{position:relative}.top:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff9933 0 33.33%,#fff 33.33% 66.66%,#138808 66.66% 100%);border-bottom:1px solid #e8e8e8}
.side{background:#102d50}.logo{background:#ff9933;color:#173b35}.nav button:hover,.nav button.active{background:#174e3a;color:#fff}.btn.primary{background:#ff9933;border-color:#ff9933;color:#172c42}.btn.primary:hover{background:#f28a1c;border-color:#f28a1c}.btn.dark{background:#102d50;border-color:#102d50}.staticon{background:#eaf4e8;color:#138808}.tag{background:#eaf4e8;color:#176b20}.driverhero{background:linear-gradient(115deg,#102d50,#145c3d);border-top:4px solid #ff9933}.publichero{background:linear-gradient(110deg,#fff2e2 0 32%,#fff 32% 67%,#eaf5e7 67% 100%);border-left:4px solid #ff9933;border-bottom:2px solid #138808}.maphead{border-top:2px solid #138808}.brand small{color:#d3e3ef}.sidefoot{border-top-color:#385777}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><div class="modal" id="modal"></div>
<script>
const state={role:'official',page:'overview',filter:'All',mapState:'Manipur',mapDistrict:'All districts',incidents:[{type:'Landslide',road:'NH-202 · Ukhrul approach',detail:'One lane affected; passable with caution',severity:'High',time:'18 min ago'},{type:'Heavy rainfall warning',road:'Churachandpur district',detail:'Monitor low-lying crossings',severity:'Medium',time:'1 hr ago'},{type:'Road maintenance',road:'NH-2 · Senapati section',detail:'Delays expected until 16:00',severity:'Medium',time:'3 hrs ago'}],delivered:5,route:{from:'Imphal',to:'Ukhrul'}};
const navs={official:[['overview','▦','Overview'],['routes','⌖','Route planning'],['incidents','⚑','Incidents'],['vehicles','▰','Vehicle tracking'],['access','◉','District access'],['reports','▤','Reports']],driver:[['trip','⌖','My trip'],['deliveries','▣','Deliveries'],['roadupdates','⚠','Road updates'],['driverhelp','☎','Help & support']],user:[['public','⌖','Check a route'],['alerts','⚠','Road alerts'],['supplies','＋','Request supplies'],['about','ⓘ','About SMART PATH']]};
const icons={overview:'<path d="M3 10 12 3l9 7v10h-6v-6H9v6H3z"/>',routes:'<path d="M4 19 9 5l6 14 5-14"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="5" r="2"/>',incidents:'<path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v4m0 3h.01"/>',vehicles:'<path d="M3 7h11v11H3zM14 11h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',access:'<path d="M4 19V5m0 14h16"/><path d="m7 15 4-4 3 2 5-6"/>',reports:'<path d="M5 3h10l4 4v14H5zM15 3v5h5"/><path d="M8 12h8M8 16h8"/>',trip:'<path d="M4 19 9 5l6 14 5-14"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="5" r="2"/>',deliveries:'<path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/>',roadupdates:'<path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v4m0 3h.01"/>',driverhelp:'<path d="M5 4h4l2 5-3 2a15 15 0 0 0 5 5l2-3 5 2v4"/>',public:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',alerts:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',supplies:'<path d="M4 7h16v14H4zM2 3h20v4H2zM12 11v6m-3-3h6"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',truck:'<path d="M3 7h11v11H3zM14 11h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',van:'<path d="M3 7h13v11H3zM16 10h3l2 4v4h-5z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="m6 17 4-7h4l4 7m-8-7 4 7H8m4-10h3"/>',role:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'};
function icon(name){return `<svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.about}</svg>`}

const roleNames={official:'Government official',driver:'Driver',user:'Public user'};const pages={overview:'Operations overview',routes:'Route planning',incidents:'Incident management',vehicles:'Live vehicle tracking',access:'District accessibility',reports:'Operations reports',trip:'My active trip',deliveries:'Delivery assignments',roadupdates:'Road updates',driverhelp:'Driver help & support',public:'Check road accessibility',alerts:'Road alerts & advisories',supplies:'Essential goods request',about:'About SMART PATH'};
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function button(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
const regions={
'Arunachal Pradesh':{center:[27.1,93.6],zoom:7,districts:['Anjaw','Bichom','Changlang','Dibang Valley','East Kameng','East Siang','Itanagar Capital Complex','Kamle','Keyi Panyor','Kra Daadi','Kurung Kumey','Lepa Rada','Lohit','Longding','Lower Dibang Valley','Lower Siang','Lower Subansiri','Namsai','Pakke-Kessang','Papum Pare','Shi Yomi','Siang','Tawang','Tirap','Upper Siang','Upper Subansiri','West Kameng','West Siang']},
Assam:{center:[26.2,92.8],zoom:7,districts:['Bajali','Baksa','Barpeta','Biswanath','Bongaigaon','Cachar','Charaideo','Chirang','Darrang','Dhemaji','Dhubri','Dibrugarh','Dima Hasao','Goalpara','Golaghat','Hailakandi','Hojai','Jorhat','Kamrup','Kamrup Metropolitan','Karbi Anglong','Sribhumi (Karimganj)','Kokrajhar','Lakhimpur','Majuli','Morigaon','Nagaon','Nalbari','Sivasagar','Sonitpur','South Salmara-Mankachar','Tinsukia','Tamulpur','Udalguri','West Karbi Anglong']},
Manipur:{center:[24.8,93.9],zoom:8,districts:['Bishnupur','Chandel','Churachandpur','Imphal East','Imphal West','Jiribam','Kakching','Kamjong','Kangpokpi','Noney','Pherzawl','Senapati','Tamenglong','Tengnoupal','Thoubal','Ukhrul']},
Meghalaya:{center:[25.5,91.3],zoom:8,districts:['East Garo Hills','East Jaintia Hills','East Khasi Hills','Eastern West Khasi Hills','North Garo Hills','Ri Bhoi','South Garo Hills','South West Garo Hills','South West Khasi Hills','West Garo Hills','West Jaintia Hills','West Khasi Hills']},
Mizoram:{center:[23.3,92.8],zoom:7,districts:['Aizawl','Saitual','Khawzawl','Champhai','Serchhip','Lunglei','Hnahthial','Lawngtlai','Siaha','Kolasib','Mamit']},
Nagaland:{center:[26.0,94.5],zoom:7,districts:['Chümoukedima','Dimapur','Kiphire','Kohima','Longleng','Meluri','Mokokchung','Mon','Niuland','Noklak','Peren','Phek','Shamator','Tseminyu','Tuensang','Wokha','Zünheboto']},
Sikkim:{center:[27.5,88.5],zoom:8,districts:['Gangtok','Gyalshing','Mangan','Namchi','Pakyong','Soreng']},
Tripura:{center:[23.8,91.6],zoom:8,districts:['Dhalai','Gomati','Khowai','North Tripura','Sepahijala','South Tripura','Unakoti','West Tripura']}
};
const stateBounds={'Arunachal Pradesh':[91.4,26.5,97.5,29.6],Assam:[89.5,24,96.1,28],Manipur:[92.9,23.7,94.9,25.8],Meghalaya:[89.6,24.9,92.9,26.3],Mizoram:[92,21.8,93.6,24.6],Nagaland:[93.3,25.1,95.5,27.1],Sikkim:[87.9,26.9,89.1,28.2],Tripura:[91,22.8,92.4,24.7]};
function mapUrl(){let r=regions[state.mapState]||regions.Manipur,[lat,lon]=r.center,[left,bottom,right,top]=stateBounds[state.mapState]||stateBounds.Manipur;return `https://www.openstreetmap.org/export/embed.html?bbox=${left}%2C${bottom}%2C${right}%2C${top}&layer=mapnik&marker=${lat}%2C${lon}`}
function map(){let r=regions[state.mapState]||regions.Manipur;return `<div class="maptools" style="position:absolute;z-index:2;top:9px;right:9px"><select id="map-state" aria-label="Select state">${Object.keys(regions).map(x=>`<option ${x===state.mapState?'selected':''}>${x}</option>`).join('')}</select><select id="map-district" class="district-select" aria-label="Select district"><option>All districts</option>${r.districts.map(x=>`<option ${x===state.mapDistrict?'selected':''}>${x}</option>`).join('')}</select></div><div class="mapbox"><div class="maplabel"><span class="dot"></span>Interactive OpenStreetMap · ${state.mapState}${state.mapDistrict&&state.mapDistrict!=='All districts'?' · '+state.mapDistrict:''}</div><iframe id="region-map" title="Interactive map of ${state.mapState}" loading="lazy" src="${mapUrl()}"></iframe><a class="maplink" target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query=${encodeURIComponent((state.mapDistrict&&state.mapDistrict!=='All districts'?state.mapDistrict+', ':'')+state.mapState+', India')}">Open selected area ↗</a><div class="legend"><span><i style="background:#188064"></i>Road corridors</span><span><i style="background:#d59a3b"></i>Sample risk data</span></div></div>`}
async function focusDistrict(){let frame=document.querySelector('#region-map');if(!frame)return;let region=regions[state.mapState],lat=region.center[0],lon=region.center[1],box=stateBounds[state.mapState]||stateBounds.Manipur;if(state.mapDistrict&&state.mapDistrict!=='All districts'){try{let q=encodeURIComponent(`${state.mapDistrict}, ${state.mapState}, India`),response=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${q}`,{headers:{'Accept':'application/json','Accept-Language':'en'}}),data=await response.json();if(data[0]){lat=Number(data[0].lat);lon=Number(data[0].lon);box=[lon-.22,lat-.16,lon+.22,lat+.16]}else toast('District not found; showing the full state.')}catch(e){toast('District lookup unavailable; showing the full state.')}}frame.src=`https://www.openstreetmap.org/export/embed.html?bbox=${box.join('%2C')}&layer=mapnik&marker=${lat}%2C${lon}`}
function title(kicker,title,sub,actions=''){return `<div class="title"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`}
function stats(items){return `<section class="grid stats">${items.map((x,i)=>`<article class="stat"><div class="stathead">${x[0]}<span class="staticon">${icon(['access','vehicles','roadupdates','incidents'][i%4])}</span></div><div class="statvalue">${x[1]} <span class="trend">${x[2]||''}</span></div></article>`).join('')}</section>`}
function incRows(){return state.incidents.map((i,n)=>`<div class="incident"><i class="sev ${i.severity==='Medium'?'amber':''}"></i><div><b>${i.type} · ${i.road}</b><p>${i.detail}</p></div><time>${i.time}</time>${button('Details','incident-detail-'+n,'btn small')}</div>`).join('')}
function routeForm(publicMode=false){let d=(regions[state.mapState]||regions.Manipur).districts,from=state.mapState==='Manipur'?'Imphal East':d[0],to=state.mapState==='Manipur'?'Ukhrul':d[Math.min(2,d.length-1)];return `<div class="field"><label>ORIGIN · ${state.mapState.toUpperCase()}</label><select id="origin">${d.map(x=>`<option ${x===from?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>DESTINATION · ${state.mapState.toUpperCase()}</label><select id="destination">${d.map(x=>`<option ${x===to?'selected':''}>${x}</option>`).join('')}</select></div>${publicMode?'':`<div class="field"><label>VEHICLE TYPE</label><select id="vehicle"><option>Truck · heavy cargo</option><option>Van · medium cargo</option><option>Motorbike · urgent / light</option></select></div>`}${button(publicMode?'Check route accessibility':'Find safest route →','calculate','btn primary')}<div id="route-result"></div>`}
function resultMarkup(from,to){let same=from===to;return `<div class="routefacts"><div><b>${same?'—':from==='Imphal'&&to==='Ukhrul'?'62 km':'84 km'}</b><span>DISTANCE</span></div><div><b>${same?'—':from==='Imphal'&&to==='Ukhrul'?'1h 48m':'2h 35m'}</b><span>EST. TIME</span></div><div><b>${same?'—':'0.24'}</b><span>RISK SCORE</span></div></div><div class="row"><div><b>${from} → ${to}</b><small>Primary corridor · terrain and road conditions included</small></div><span class="tag">LOW RISK</span></div><div class="row"><div><b>Alternate route available</b><small>Longer by 19 km · lower disruption exposure</small></div><span class="tag warn">COMPARE</span></div>${button('Save route','save-route','btn small')}</div>`}
function official(){if(state.page==='overview')return `${title('Regional operations · '+state.mapState,'Good morning, Asha','A live view of road access and essential goods movement across the region.',button('↻ Refresh data','refresh')+button('＋ Report an incident','open-report','btn primary'))}${stats([['Network accessible','76%','↑ 4.2%'],['Vehicles in transit','28','6 deliveries today'],['Routes at risk','07','2 need review'],['Active incidents','03','1 critical']])}<section class="grid layout"><article class="card mapcard"><div class="maphead"><div><h2>Regional access map</h2><div class="muted">Road status, active incidents and vehicle locations</div></div><span class="muted">Select a state and district below</span></div>${map()}</article><aside class="rightcol"><article class="card"><div class="cardhead"><h2>Plan a route</h2>${button('⇅ Swap','swap-route','btn small')}</div>${routeForm()}</article>${vehicleMini()}</aside></section><section class="split"><article class="card"><div class="cardhead"><h2>Recent incidents</h2>${button('View all →','go-incidents','btn small')}</div>${incRows()}</article>${districtCard()}</section>`;
if(state.page==='routes')return `${title('Route intelligence','Route planning','Compare safe, terrain-aware routes for essential cargo.',button('Clear route','clear-route'))}<section class="grid layout"><article class="card"><div class="cardhead"><h2>Regional access map</h2><span class="muted">Manipur · road surface and disruption overlays</span></div>${map()}</article><article class="card"><div class="cardhead"><h2>Build your route</h2></div>${routeForm()}</article></section><article class="card" style="margin-top:13px"><div class="cardhead"><h2>Routing considers</h2></div><div class="row"><div><b>Terrain and elevation</b><small>Grades and elevation changes influence travel time</small></div><span class="tag">Included</span></div><div class="row"><div><b>Road surface and vehicle fit</b><small>Road width and condition inform vehicle guidance</small></div><span class="tag">Included</span></div><div class="row"><div><b>Weather and disruption exposure</b><small>Current demo incidents affect the illustrative risk score</small></div><span class="tag">Included</span></div></article>`;
if(state.page==='incidents')return `${title('Field intelligence','Incident management','Review, filter and report road disruptions.',button('＋ Report incident','open-report','btn primary'))}<article class="card"><div class="cardhead"><h2>Incident reports <span class="muted">(${state.incidents.length})</span></h2>${button('Export CSV','export-incidents','btn small')}</div><div class="filterbar"><select id="incident-filter"><option>All</option><option>High</option><option>Medium</option><option>Low</option></select><input id="incident-search" placeholder="Search road or incident"></div><div class="tablewrap"><table class="table"><thead><tr><th>Type / location</th><th>Severity</th><th>Reported</th><th>Status</th><th>Action</th></tr></thead><tbody id="incident-table">${incidentTable()}</tbody></table></div></article>`;
if(state.page==='vehicles')return `${title('Fleet operations','Live vehicle tracking','Monitor active deliveries and respond to route delays.',button('↻ Refresh positions','refresh'))}<section class="grid layout"><article class="card mapcard"><div class="maphead"><h2>Vehicle locations</h2><span class="tag">28 active</span></div>${map()}</article><article class="card"><div class="cardhead"><h2>Vehicles on the move</h2></div>${vehicleRows()}</article></section><article class="card" style="margin-top:13px"><div class="cardhead"><h2>Current assignments</h2>${button('Assign vehicle','assign-vehicle','btn primary small')}</div>${vehicleTable()}</article>`;
if(state.page==='access')return `${title('Network health','District accessibility','Road access by district, based on current demonstration status.',button('Download report','download-report'))}<section class="grid stats">${[['Accessible network','76%','Across pilot area'],['At risk','16%','Weather / surface'],['Blocked','8%','2 known closures'],['Last updated','09:42','Simulated feed']].map((x,i)=>`<article class="stat"><div class="stathead">${x[0]}<span class="staticon">${['⌁','⚠','⛔','◷'][i]}</span></div><div class="statvalue">${x[1]}</div><div class="muted">${x[2]}</div></article>`).join('')}</section><section class="grid layout"><article class="card"><div class="cardhead"><h2>District status</h2><span class="muted">Accessible roads, percent</span></div>${districtBars()}</article><article class="card"><div class="cardhead"><h2>Priority bottlenecks</h2></div><div class="row"><div><b>NH-202 · Ukhrul approach</b><small>Landslide debris · one lane</small></div><span class="tag red">HIGH</span></div><div class="row"><div><b>NH-2 · Senapati</b><small>Maintenance · delays</small></div><span class="tag warn">MEDIUM</span></div><div class="row"><div><b>Churachandpur low crossings</b><small>Heavy rain watch</small></div><span class="tag warn">MEDIUM</span></div></article></section>`;
return `${title('Performance','Operations reports','Summary of simulated regional activity.',button('Export report','download-report','btn primary'))}${stats([['Deliveries completed',state.delivered,'Today'],['Average route risk','0.24','Pilot corridors'],['Incidents resolved','12','This week'],['On-time arrival','89%','↑ 3%']])}<section class="split"><article class="card"><div class="cardhead"><h2>Weekly delivery activity</h2><select><option>Last 7 days</option><option>Last 30 days</option></select></div>${[['Mon',58],['Tue',76],['Wed',63],['Thu',89],['Fri',52],['Sat',43],['Sun',67]].map(x=>`<div class="barline"><span>${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><span>${x[1]}%</span></div>`).join('')}</article><article class="card"><div class="cardhead"><h2>Report includes</h2></div><p class="muted">Delivery completion, route risk, district accessibility and incident trends.</p>${button('Download CSV','download-report','btn')}${button('Print report','print-report','btn')}</article></section>`}
function incidentTable(){let f=state.filter,search=(document.querySelector('#incident-search')?.value||'').toLowerCase();return state.incidents.filter(i=>(f==='All'||i.severity===f)&&(`${i.type} ${i.road}`.toLowerCase().includes(search))).map((i,n)=>`<tr><td><b>${i.type}</b><br><span class="muted">${i.road}</span></td><td><span class="tag ${i.severity==='High'?'red':'warn'}">${i.severity}</span></td><td>${i.time}</td><td><span class="tag">Monitoring</span></td><td>${button('Review','incident-detail-'+n,'btn small')}</td></tr>`).join('')||'<tr><td colspan="5">No matching incidents.</td></tr>'}
function vehicleMini(){return `<article class="card"><div class="cardhead"><h2>Vehicles in transit</h2>${button('View all','go-vehicles','btn small')}</div>${vehicleRows(3)}</article>`}
function vehicleRows(limit=10){let a=[['truck','MN-01-TR-2048','Imphal → Ukhrul · 64%','On route'],['van','MN-02-VN-1182','Imphal → Moreh · 31%','Slowed'],['bike','MN-01-MB-0624','Churachandpur · medical supply','On route'],['truck','MN-03-TR-0911','Jiribam → Imphal · 82%','On route']];return a.slice(0,limit).map(x=>`<div class="row"><div><b><span class="vehico">${icon(x[0])}</span>${x[1]}</b><small>${x[2]}</small></div><span class="tag ${x[3]==='Slowed'?'warn':''}">${x[3]}</span></div>`).join('')}
function vehicleTable(){return `<div class="tablewrap"><table class="table"><thead><tr><th>Vehicle</th><th>Route</th><th>Progress</th><th>Status</th><th>Action</th></tr></thead><tbody>${[['MN-01-TR-2048','Imphal → Ukhrul','64%','On route'],['MN-02-VN-1182','Imphal → Moreh','31%','Slowed'],['MN-01-MB-0624','Churachandpur local','—','On route'],['MN-03-TR-0911','Jiribam → Imphal','82%','On route']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="tag ${x[3]==='Slowed'?'warn':''}">${x[3]}</span></td><td>${button('Locate','locate-'+x[0],'btn small')}</td></tr>`).join('')}</tbody></table></div>`}
function districtBars(){let d=(regions[state.mapState]||regions.Manipur).districts;return d.slice(0,8).map((name,i)=>{let value=58+((name.length*13+i*11)%39);return `<div class="barline"><span>${name}</span><div class="bar"><i style="width:${value}%;background:${value<70?'#d59a3b':'#18745e'}"></i></div><span>${value}%</span></div>`}).join('')}
function districtCard(){return `<article class="card"><div class="cardhead"><h2>District accessibility</h2>${button('View report','go-access','btn small')}</div>${districtBars()}</article>`}
function driver(){if(state.page==='trip')return `${title('Driver workspace','Good morning, Rohan','Your active delivery and route guidance.',button('Report road issue','open-report','btn'))}<section class="driverhero"><div><h2>Medical supplies · Ukhrul Health Centre</h2><p>Delivery SP-2048 · 12 boxes · Keep this screen available while en route</p></div><span class="tag">IN TRANSIT</span></section><section class="grid mobilegrid"><article class="card"><div class="cardhead"><h2>Active route</h2><span class="tag warn">Caution near Ukhrul</span></div>${map()}<div class="routecard"><div style="display:flex;justify-content:space-between"><b>Imphal → Ukhrul</b><span class="muted">38 km remaining</span></div><div class="routeprogress"><i></i></div><div class="muted">64% complete · Estimated arrival 12:18 · NH-202</div><div class="actions" style="margin-top:11px">${button('Open navigation','navigation','btn primary')}${button('Mark arrived','mark-arrived','btn')}</div></div></article><article class="card"><div class="cardhead"><h2>Next steps</h2></div><div class="row"><div><b>1 · Imphal depot</b><small>Pickup completed · 09:12</small></div><span class="tag">DONE</span></div><div class="row"><div><b>2 · Ukhrul approach</b><small>Slow down · narrow, winding road</small></div><span class="tag warn">CAUTION</span></div><div class="row"><div><b>3 · Ukhrul Health Centre</b><small>Delivery point · 38 km remaining</small></div><span class="tag">NEXT</span></div><div class="notice">⚠ Field report: minor landslide on one lane. Proceed only if safe; follow local directions.</div><div class="actions">${button('I see the alert','ack-alert','btn primary')}${button('Call dispatch','call-dispatch','btn')}</div></article></section><section class="split"><article class="card"><div class="cardhead"><h2>Quick actions</h2></div><div class="quick"><button data-action="open-report">${icon('incidents')}<strong>Report a road issue</strong><span>Share a hazard with dispatch</span></button><button data-action="delivery-proof">${icon('deliveries')}<strong>Delivery proof</strong><span>Confirm a completed handoff</span></button><button data-action="offline-mode">${icon('access')}<strong>Offline status</strong><span>Routes saved for low signal</span></button><button data-action="call-dispatch">${icon('driverhelp')}<strong>Contact dispatch</strong><span>Get help with this delivery</span></button></div></article><article class="card"><div class="cardhead"><h2>Road updates on your route</h2></div>${state.incidents.slice(0,2).map(i=>`<div class="incident"><i class="sev amber"></i><div><b>${i.type}</b><p>${i.road} · ${i.detail}</p></div></div>`).join('')}</article></section>`;
if(state.page==='deliveries')return `${title('Driver workspace','Delivery assignments','View your assigned essential goods deliveries.',button('Refresh assignments','refresh'))}<div class="filterbar"><select><option>Today</option><option>Upcoming</option><option>Completed</option></select><select><option>All delivery types</option><option>Medicine</option><option>Food</option><option>Relief materials</option></select></div><section class="grid split">${[['SP-2048','Medical supplies','Imphal → Ukhrul','12 boxes · Priority','In transit'],['SP-2051','Food supplies','Imphal → Moreh','40 packages · Standard','Assigned'],['SP-2053','Relief materials','Churachandpur local','6 kits · Priority','Upcoming']].map((x,i)=>`<article class="card"><div class="cardhead"><span class="tag ${i===0?'':'warn'}">${x[4]}</span><b>${x[0]}</b></div><h2>${x[1]}</h2><p class="muted">${x[2]}<br>${x[3]}</p>${button(i===0?'Open active trip':'View assignment',i===0?'go-trip':'assignment-'+x[0],'btn primary')}</article>`).join('')}</section>`;
if(state.page==='roadupdates')return `${title('Driver workspace','Road updates','Current advisories relevant to your routes.',button('Refresh updates','refresh'))}<section class="card">${state.incidents.map((i,n)=>`<div class="incident"><i class="sev ${i.severity==='Medium'?'amber':''}"></i><div><b>${i.type} · ${i.road}</b><p>${i.detail}</p><p>Severity: ${i.severity} · Advice: follow local instructions and allow extra travel time.</p></div><time>${i.time}</time>${button('Acknowledge','ack-update-'+n,'btn small')}</div>`).join('')}</section>`;
return `${title('Driver workspace','Help & support','Useful contacts and field guidance for your delivery.',button('Contact dispatch','call-dispatch','btn primary'))}<section class="grid split"><article class="card"><div class="cardhead"><h2>Emergency & operations contacts</h2></div>${[['Dispatch control','+91 1800 000 2040'],['District operations desk','+91 1800 000 2020'],['Emergency services','112']].map(x=>`<div class="row"><div><b>${x[0]}</b><small>${x[1]}</small></div>${button('Call','call-'+x[0],'btn small')}</div>`).join('')}</article><article class="card"><div class="cardhead"><h2>Field guidance</h2></div><p class="muted">Do not continue through a flooded crossing or an unsafe landslide area. Stop at a safe location, notify dispatch, and follow local authority guidance. Route estimates are advisory.</p>${button('Report a road issue','open-report','btn')}</article></section>`}
function user(){if(state.page==='public')return `${title('Public access','Check road accessibility','Plan a journey across the region with current road advisories.',button('View all alerts','go-alerts','btn'))}<section class="publichero"><h2>Know before you go.</h2><p>Check road status and travel estimates before heading out. Information shown here is a demonstration.</p></section><section class="grid layout"><article class="card mapcard"><div class="maphead"><h2>Manipur road status</h2><span class="muted">Illustrative access map</span></div>${map()}</article><article class="card"><div class="cardhead"><h2>Plan your journey</h2></div>${routeForm(true)}<div class="notice">Travel estimates can change with weather and road conditions. Follow local advisories.</div></article></section><section class="card" style="margin-top:13px"><div class="cardhead"><h2>Current road alerts</h2>${button('See all','go-alerts','btn small')}</div>${incRows()}</section>`;
if(state.page==='alerts')return `${title('Public access','Road alerts & advisories','Recent reports that may affect travel.',button('Refresh alerts','refresh'))}<section class="card">${state.incidents.map(i=>`<div class="incident"><i class="sev ${i.severity==='Medium'?'amber':''}"></i><div><b>${i.type} · ${i.road}</b><p>${i.detail}</p><p>Severity: ${i.severity} · Check conditions before travel.</p></div><time>${i.time}</time></div>`).join('')}</section>`;
if(state.page==='supplies')return `${title('Public access','Request essential supplies','Send a request to the district coordination team.', '')}<article class="card" style="max-width:620px"><div class="notice">For immediate emergencies, contact local emergency services. Requests here are demonstration-only and are not sent to authorities.</div><div class="field"><label>YOUR NAME</label><input id="req-name" placeholder="Full name"></div><div class="field"><label>VILLAGE / LOCATION</label><input id="req-location" placeholder="District, village or landmark"></div><div class="field"><label>SUPPLY NEEDED</label><select id="req-type"><option>Medicine</option><option>Food and water</option><option>Relief materials</option><option>Other essential goods</option></select></div><div class="field"><label>DETAILS</label><textarea id="req-detail" placeholder="What is needed, and for how many people?"></textarea></div>${button('Submit demonstration request','submit-request','btn primary')}</article>`;
return `${title('About the service','SMART PATH NER','A logistics and accessibility prototype for North Eastern Region operations.', '')}<section class="grid split"><article class="card"><h2>What this prototype demonstrates</h2><p class="muted">Terrain-aware route planning, road disruption reporting, vehicle progress and district accessibility in a shared operations workspace.</p><p class="muted">The map and operational figures are sample content. Production deployment requires verified road, terrain, weather and incident feeds.</p></article><article class="card"><h2>Stay informed</h2><p class="muted">Review the latest road advisories before travelling.</p>${button('Check current alerts','go-alerts','btn primary')}</article></section>`}
function pageBody(){return state.role==='official'?official():state.role==='driver'?driver():user()}
function render(){let items=navs[state.role],current=items.some(x=>x[0]===state.page)?state.page:items[0][0];state.page=current;document.querySelector('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">${icon('routes')}</div><div><b>SMART PATH</b><small>NORTH EAST INDIA</small></div></div><div class="rolebox"><div class="role-heading"><span class="role-glyph" aria-hidden="true">${icon('role')}</span><label for="role-select">VIEWING AS</label></div><select id="role-select" aria-label="Switch interface role"><option value="official" ${state.role==='official'?'selected':''}>Government official</option><option value="driver" ${state.role==='driver'?'selected':''}>Driver</option><option value="user" ${state.role==='user'?'selected':''}>Public user</option></select></div><div class="navlabel">${state.role==='official'?'Operations':state.role==='driver'?'Driver tools':'Explore'}</div><nav class="nav">${items.map(x=>`<button class="${x[0]===state.page?'active':''}" data-page="${x[0]}"><span class="ico">${icon(x[0])}</span><span class="navtext">${x[2]}</span></button>`).join('')}</nav><div class="sidefoot"><span class="dot"></span>Regional demo network online<br>Last sync · 2 minutes ago</div></aside><main class="main"><header class="top"><div class="crumb">SMART PATH　/　<b>${pages[state.page]}</b></div><div class="topright"><span class="date">25 September 2026</span>${button(icon('bell'),'notifications','iconbtn')}<div class="avatar">${state.role==='driver'?'RD':state.role==='user'?'GU':'AO'}</div></div></header><div class="wrap">${pageBody()}<p style="font-size:9px;color:#87958e;text-align:right;margin:15px 2px 0">Prototype · Simulated data · Not for operational or emergency decisions</p></div></main></div>`}
function modalReport(){return `<div class="modalbox"><div class="cardhead"><h2>Report a road incident</h2>${button('×','close-modal','btn small')}</div><div class="notice">Demonstration report only. This does not notify an authority or emergency service.</div><div class="field"><label>INCIDENT TYPE</label><select id="new-type"><option>Landslide</option><option>Flooding</option><option>Blocked road</option><option>Bridge damage</option><option>Road surface damage</option></select></div><div class="field"><label>LOCATION / ROAD</label><input id="new-road" placeholder="e.g. NH-202, Ukhrul approach"></div><div class="field"><label>SEVERITY</label><select id="new-sev"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field"><label>DESCRIPTION</label><textarea id="new-detail" placeholder="Share what other teams or travellers should know"></textarea></div><div class="modalfoot">${button('Cancel','close-modal','btn')}${button('Submit report','submit-incident','btn primary')}</div></div>`}
function openModal(html){let m=document.querySelector('#modal');m.innerHTML=html;m.classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}
function handle(action,el){if(action==='open-report'){openModal(modalReport());return}if(action==='close-modal'){closeModal();return}if(action==='submit-incident'){let road=document.querySelector('#new-road').value.trim();if(!road){toast('Add a location so the report can be identified.');return}state.incidents.unshift({type:document.querySelector('#new-type').value,road,detail:document.querySelector('#new-detail').value.trim()||'New field report · awaiting verification',severity:document.querySelector('#new-sev').value,time:'Just now'});closeModal();render();toast('Demonstration incident added to the feed.');return}if(action==='calculate'){let from=document.querySelector('#origin')?.value||'Imphal',to=document.querySelector('#destination')?.value||'Ukhrul';let target=document.querySelector('#route-result');if(target){target.innerHTML=resultMarkup(from,to);state.route={from,to};}else toast('Route controls are unavailable on this view.');return}if(action==='swap-route'){let a=document.querySelector('#origin'),b=document.querySelector('#destination');if(a&&b){let t=a.value;a.value=b.value;b.value=t;toast('Route endpoints swapped.')}return}if(action==='clear-route'){let r=document.querySelector('#route-result');if(r)r.innerHTML='';toast('Route results cleared.');return}if(action==='save-route'){toast(`Route ${state.route.from} to ${state.route.to} saved to this session.`);return}if(action==='refresh'||action==='refresh-updates'||action==='refresh-assignments'){toast('Data refreshed · this prototype uses simulated data.');return}if(action==='go-incidents'){go('incidents');return}if(action==='go-vehicles'){go('vehicles');return}if(action==='go-access'){go('access');return}if(action==='go-trip'){go('trip');return}if(action==='go-alerts'){go('alerts');return}if(action.startsWith('incident-detail-')){let i=state.incidents[Number(action.split('-').pop())];openModal(`<div class="modalbox"><div class="cardhead"><h2>Incident details</h2>${button('×','close-modal','btn small')}</div><h2>${i?.type||'Incident'}</h2><p class="muted">${i?.road||''}</p><p>${i?.detail||''}</p><p class="muted">Severity: ${i?.severity||'Unknown'} · Reported ${i?.time||''}</p><div class="modalfoot">${button('Close','close-modal','btn')}</div></div>`);return}if(action.startsWith('ack-update-')||action==='ack-alert'){toast('Alert acknowledged for this session.');return}if(action==='navigation'){toast('Navigation guidance opened · offline route guidance is simulated.');return}if(action==='mark-arrived'){state.delivered++;toast('Arrival recorded · delivery count updated.');return}if(action==='delivery-proof'){openModal(`<div class="modalbox"><div class="cardhead"><h2>Confirm delivery</h2>${button('×','close-modal','btn small')}</div><div class="field"><label>RECIPIENT NAME</label><input id="recipient" placeholder="Name of recipient"></div><div class="field"><label>DELIVERY NOTES</label><textarea id="proof-note" placeholder="Optional handoff notes"></textarea></div><div class="modalfoot">${button('Cancel','close-modal','btn')}${button('Confirm handoff','confirm-proof','btn primary')}</div></div>`);return}if(action==='confirm-proof'){let n=document.querySelector('#recipient').value.trim();if(!n){toast('Enter a recipient name to record the handoff.');return}state.delivered++;closeModal();toast(`Delivery handoff recorded for ${n}.`);return}if(action==='offline-mode'){toast('Offline mode is ready · sample route data cached for this demo.');return}if(action==='call-dispatch'||action.startsWith('call-')){openModal(`<div class="modalbox"><div class="cardhead"><h2>Contact dispatch</h2>${button('×','close-modal','btn small')}</div><p class="muted">Dispatch control · +91 1800 000 2040</p><div class="notice">Phone calling is not connected in this prototype. Use your device to call local dispatch.</div><div class="modalfoot">${button('Close','close-modal','btn primary')}</div></div>`);return}if(action==='submit-request'){let name=document.querySelector('#req-name').value.trim(),loc=document.querySelector('#req-location').value.trim();if(!name||!loc){toast('Enter your name and location to continue.');return}openModal(`<div class="modalbox"><h2>Request recorded in demo</h2><p class="muted">Thank you, ${name}. Your ${document.querySelector('#req-type').value.toLowerCase()} request for ${loc} was recorded locally in this prototype. It was not sent to a response team.</p><div class="modalfoot">${button('Done','close-modal','btn primary')}</div></div>`);return}if(action==='export-incidents'){let csv='Type,Location,Detail,Severity,Reported\n'+state.incidents.map(i=>[i.type,i.road,i.detail,i.severity,i.time].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');download(csv,'smart-path-incidents.csv','text/csv');toast('Incident CSV downloaded.');return}if(action==='download-report'){download('SMART PATH NER — DEMO REPORT\n\nAccessible network: 76%\nVehicles in transit: 28\nActive incidents: '+state.incidents.length+'\n\nSimulated demonstration data only.','smart-path-report.txt','text/plain');toast('Demo report downloaded.');return}if(action==='print-report'){window.print();return}if(action==='assign-vehicle'){openModal(`<div class="modalbox"><div class="cardhead"><h2>Assign a vehicle</h2>${button('×','close-modal','btn small')}</div><div class="field"><label>VEHICLE</label><select><option>MN-01-TR-2048</option><option>MN-02-VN-1182</option><option>MN-01-MB-0624</option></select></div><div class="field"><label>DESTINATION</label><select><option>Ukhrul Health Centre</option><option>Moreh distribution point</option><option>Churachandpur depot</option></select></div><div class="modalfoot">${button('Cancel','close-modal','btn')}${button('Assign','save-assignment','btn primary')}</div></div>`);return}if(action==='save-assignment'){closeModal();toast('Vehicle assignment saved in this demo session.');return}if(action.startsWith('locate-')){toast(`${action.slice(7)} highlighted on the regional map.`);return}if(action.startsWith('assignment-')){toast(`Assignment ${action.slice(11)} opened.`);return}if(action==='notifications'){toast('No new notifications.');return}toast('Action completed in this prototype.')}
function download(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function go(page){state.page=page;render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b);let n=e.target.closest('[data-page]');if(n){state.page=n.dataset.page;render()}});document.addEventListener('change',e=>{if(e.target.id==='role-select'){state.role=e.target.value;state.page=navs[state.role][0][0];render()}if(e.target.id==='incident-filter'){state.filter=e.target.value;let t=document.querySelector('#incident-table');if(t)t.innerHTML=incidentTable()}});document.addEventListener('change',e=>{if(e.target.id==='map-state'){state.mapState=e.target.value;state.mapDistrict='All districts';render();focusDistrict()}else if(e.target.id==='map-district'){state.mapDistrict=e.target.value;let label=document.querySelector('.maplabel');if(label)label.innerHTML=`<span class="dot"></span>Interactive OpenStreetMap · ${state.mapState}${state.mapDistrict!=='All districts'?' · '+state.mapDistrict:''}`;focusDistrict()}});document.addEventListener('input',e=>{if(e.target.id==='incident-search'){let t=document.querySelector('#incident-table');if(t)t.innerHTML=incidentTable()}});document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
